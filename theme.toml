"editor.bg" = { bg = "bg" }
"editor.fg" = { fg = "fg" }
"editor.popup.bg" = { bg = "bg_darker" }

# ============================================
# 模式显示样式
# ============================================
"mode.normal" = { fg = "green", modifier = "bold" }
"mode.insert" = { fg = "blue", modifier = "bold" }
"mode.command" = { fg = "yellow", modifier = "bold" }
"mode.search" = { fg = "purple", modifier = "bold" }

# ============================================
# 标题样式 (H1-H6)
# ============================================
"node.heading.h1" = { fg = "red", modifier = "bold" }
"node.heading.h2" = { fg = "orange", modifier = "bold" }
"node.heading.h3" = { fg = "yellow", modifier = "bold" }
"node.heading.h4" = { fg = "green", modifier = "bold" }
"node.heading.h5" = { fg = "cyan", modifier = "bold" }
"node.heading.h6" = { fg = "blue", modifier = "bold" }
"node.heading.title" = { fg = "orange", modifier = "bold" }
"node.heading" = { fg = "orange" }

# ============================================
# 基础行内样式 - 单一
# ============================================
"node.text.strong" = {  modifier = "bold" }
"node.text.italic" = { modifier = "italic" }
"node.text.underline" = {  modifier = "underlined" }
"node.text.mark" = { fg = "bg", bg = "yellow" }
"node.text.code" = { fg = "green", bg = "code_bg" }
"node.text.blockref" = { fg = "blue" }
"node.text.weblink" = { fg = "link_blue", modifier = "underlined" }
"node.text.mathblock" = { fg = "cyan" }
"node.text.tag" = { fg = "purple", modifier = "bold" }


# ============================================
# 行内样式快捷方式 (用于 TextMarkType 解析)
# ============================================
# 单一
"strong" = { fg = "fg", modifier = "bold" }
"bold" = { fg = "fg", modifier = "bold" }
"em" = { fg = "fg", modifier = "italic" }
"italic" = { fg = "fg", modifier = "italic" }
"u" = { fg = "fg", modifier = "underlined" }
"underline" = { fg = "fg", modifier = "underlined" }
"s" = { fg = "fg", modifier = "crossed_out" }
"strike" = { fg = "fg", modifier = "crossed_out" }
"del" = { fg = "fg", modifier = "crossed_out" }
"mark" = { fg = "bg", bg = "yellow" }
"highlight" = { fg = "bg", bg = "yellow" }
"code" = { fg = "green", bg = "code_bg" }
"link" = { fg = "link_blue", modifier = "underlined" }
"tag" = { fg = "purple" }

# ============================================
# 引用块样式
# ============================================
"node.blockquote" = { fg = "comment" }
"node.quote" = { bg = "comment_bg" }
"blockquote.marker" = { fg = "comment" }
"blockquote.content" = { fg = "yellow" }

# ============================================
# 列表样式
# ============================================
"node.list" = { fg = "fg" }
"list.bullet" = { fg = "comment" }
"list.number" = { fg = "comment" }
"list.task" = { fg = "green" }

# ============================================
# 代码块样式
# ============================================
"code.block" = { fg = "fg", bg = "bg_darker" }
"code.block.border" = { fg = "fg" }
"code.block.header" = { fg = "comment" }
"code.block.fence" = { fg = "comment" }
"code.block.content" = { fg = "green" }
"code.block.info" = { fg = "cyan" }
"code.inline" = { fg = "green", bg = "code_bg" }

# ============================================
# 表格样式
# ============================================
"table" = { fg = "fg" }
"table.header" = { fg = "cyan", modifier = "bold" }
"table.separator" = { fg = "comment" }
"table.cell" = { fg = "fg" }

# ============================================
# 分隔线样式
# ============================================
"divider" = { fg = "comment" }
"thematic_break" = { fg = "comment" }

# ============================================
# UI 元素样式
# ============================================
"ui.gutter" = { fg = "gutter_fg", bg = "gutter_bg" }
"ui.gutter.DECOR" = { fg = "cyan" }
"ui.bufferline" = { bg = "blue" }
"ui.statusbar" = { fg = "fg", bg = "bg_darker" }
"ui.popup" = { fg = "fg", bg = "bg_darker" }

# ============================================
# 链接和引用
# ============================================
"link.hover" = { fg = "cyan", modifier = "underlined" }
"link.visited" = { fg = "purple", modifier = "underlined" }
"blockref" = { fg = "blue" }
"fileref" = { fg = "cyan" }

# ============================================
# 特殊元素
# ============================================
"emoji" = { fg = "fg" }
"html" = { fg = "red" }
"latex" = { fg = "cyan" }
"yaml_frontmatter" = { fg = "comment" }

# ============================================
# 语法高亮 (用于代码块)
# ============================================
"keyword" = { fg = "purple", modifier = "bold" }
"string" = { fg = "green" }
"number" = { fg = "orange" }
"comment" = { fg = "comment", modifier = "italic" }
"function" = { fg = "blue" }
"type" = { fg = "yellow" }
"variable" = { fg = "fg" }
"constant" = { fg = "orange" }
"operator" = { fg = "cyan" }

