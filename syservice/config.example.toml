# SiYuan 配置文件示例
# 
# 使用方法：
# 1. 复制此文件为 config.toml
# 2. 放置到以下路径之一：
#    - Linux: ~/.config/scribe/config.toml
#    - macOS: ~/Library/Application Support/scribe/config.toml
#    - Windows: %APPDATA%\scribe\config.toml
#
# 或者设置环境变量（优先级更高）：
#    export SIYUAN_API_TOKEN="your-token-here"
#    export SIYUAN_API_URL="http://127.0.0.1:6806"

# SiYuan API 基础 URL
base_url = "http://127.0.0.1:6806"

# API 令牌（可选）
# 在思源笔记中：设置 -> 关于 -> API token
token = "1g4rmbq473pv40jo"

# HTTP 请求超时时间（秒）
timeout_secs = 30
