# SiYuan 配置文件示例
#
# 使用方法：
# 1. 复制此文件为 config.toml
# 2. 放置到以下路径之一：
#    - Linux: ~/.config/scribe/config.toml
#    - macOS: ~/Library/Application Support/scribe/config.toml
#    - Windows: %APPDATA%\scribe\config.toml
#
# 详细说明见 syservice/CONFIG.md

# SiYuan API 基础 URL
base_url = "http://127.0.0.1:6806"

# API 令牌（搜索等功能需要）
# 在思源笔记中：设置 -> 关于 -> API token
token = "your-api-token-here"

# HTTP 请求超时时间（秒）
timeout_secs = 30

# 工作空间 data 目录（读取 .sy 文件必需）
# 示例："/path/to/SiYuanKnowledgeBase/data"
workspace_dir = "/path/to/SiYuanKnowledgeBase/data"
